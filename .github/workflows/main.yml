name: Windows Hybrid Gaming Runner (V8 - Execution Fix 2)

# This block ensures the workflow can be manually triggered with inputs
on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Google CRD PowerShell Command (PASTE FULL COMMAND HERE)'
        required: true
      pin:
        description: 'CRD Pin (Default: 123456)'
        required: false
        default: '123456'
      ZEROTIER_NETWORK_ID:
        description: 'ZeroTier Network ID (e.g., 8056c2e21c32c4b8)'
        required: true

jobs:
  run-cloud-gaming:
    runs-on: windows-latest
    
    # Set maximum run time for the job
    timeout-minutes: 360 # 6 hours max run time
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- CRITICAL WINDOWS CONFIGURATION ---

      - name: Disable Windows Test Mode
        # Disabling test mode is necessary for many games (anti-cheat)
        shell: powershell
        run: |
          bcdedit.exe /set TESTSIGNING OFF
          Write-Host "Windows Test Mode has been disabled."

      - name: Re-Install Microsoft Store and Dependencies
        # This fixes issues with the Microsoft Store often being broken/removed in cloud images
        shell: powershell
        run: |
          Write-Host "Attempting to re-register Microsoft Store components..."
          Add-AppxPackage -Register "C:\Program Files\WindowsApps\Microsoft.WindowsStore_*.0_x64__8wekyb3d8bbwe\AppxManifest.xml" -DisableDevelopmentMode
          Add-AppxPackage -Register "C:\Program Files\WindowsApps\Microsoft.UI.Xaml.2.8_*.0_x64__8wekyb3d8bbwe\AppxManifest.xml" -DisableDevelopmentMode
          Add-AppxPackage -Register "C:\Program Files\WindowsApps\Microsoft.VCLibs.140.00.UWPDesktop_*.0_x64__8wekyb3d8bbwe\AppxManifest.xml" -DisableDevelopmentMode
          Write-Host "Microsoft Store components re-registered."
      
     # 2. ⚡ Install ZeroTier
    - name: 🌐 Install & Join ZeroTier
      env:
        ZT_NET: ${{ inputs.zerotier_id }}
      run: |
        Write-Host "Installing ZeroTier..."
        choco install zerotier-one -y
        
        Write-Host "Waiting for ZeroTier service..."
        for ($i=0; $i -lt 20; $i++) {
            if (Get-Service "ZeroTierOneService" -ErrorAction SilentlyContinue) { break }
            Start-Sleep -Seconds 2
        }
        
        Write-Host "Joining Network: $Env:ZT_NET"
        & "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat" join $Env:ZT_NET
        Write-Host "✅ Joined. PLEASE AUTHORIZE THIS MEMBER IN YOUR ZEROTIER DASHBOARD NOW."

    # 3. ☀️ Install Sunshine (FIXED SERVICE NAME & TIMING)
    - name: ☀️ Install Sunshine (Auto-Update & Fix)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        Write-Host "Fetching latest Sunshine release..."
        $headers = @{Authorization = "token $env:GITHUB_TOKEN"}
        $latest = Invoke-RestMethod -Uri "https://api.github.com/repos/LizardByte/Sunshine/releases/latest" -Headers $headers
        $installerUrl = $latest.assets | Where-Object { $_.name -like "*Windows*installer.exe" } | Select-Object -ExpandProperty browser_download_url | Select-Object -First 1
        
        Write-Host "⬇️ Downloading from: $installerUrl"
        Invoke-WebRequest -Uri $installerUrl -OutFile "sunshine_setup.exe"
        
        Write-Host "💿 Installing..."
        Start-Process -FilePath ".\sunshine_setup.exe" -ArgumentList "/S" -Wait
        
        # --- FIX: Wait for service registration ---
        Write-Host "Waiting for SunshineService to register..."
        $serviceName = "SunshineService"
        for ($i=0; $i -lt 30; $i++) {
            $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
            if ($svc) { 
                Write-Host "Service found!" 
                break 
            }
            Start-Sleep -Seconds 2
        }

        # --- FIX: Start the correct service name ---
        try {
            Start-Service $serviceName
            Set-Service $serviceName -StartupType Automatic
            Write-Host "✅ Sunshine Service Started Successfully."
        } catch {
            Write-Error "Failed to start SunshineService. Listing all services for debug:"
            Get-Service | Where-Object {$_.DisplayName -like "*Sunshine*"} | Format-Table -AutoSize
            exit 1
        }

    # 4. ⬇️ Install Chrome Remote Desktop
    - name: ⬇️ Install Chrome Remote Desktop
      run: |
        $crdUrl = "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" 
        Invoke-WebRequest -Uri $crdUrl -OutFile "crd.msi"
        Start-Process -FilePath "msiexec.exe" -ArgumentList "/i crd.msi /qn" -Wait

    # 5. 🚀 Launch & Keep Alive
    - name: 🚀 Launch Services & Keep Alive
      env:
        MY_PIN: ${{ inputs.pin }}
        INPUT_CMD: ${{ inputs.auth_code }}
      run: |
        if ($Env:INPUT_CMD -match '(4/[^"\s]+)') { $code = $matches[1] }
        $binary = Get-ChildItem "C:\Program Files (x86)\Google\Chrome Remote Desktop" -Recurse -Filter "remoting_start_host.exe" | Select-Object -ExpandProperty FullName -First 1
        & $binary --code=$code --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name="Apollo-Moonlight-Box" --pin=$Env:MY_PIN

        Write-Host "----------------------------------------------------------------"
        Write-Host "🎉 SETUP COMPLETE!" -ForegroundColor Green
        Write-Host "1. Go to https://my.zerotier.com and AUTHORIZE the new member."
        Write-Host "2. Connect via Chrome Remote Desktop: https://remotedesktop.google.com/access"
        Write-Host "3. In the VM, open Edge and go to https://localhost:47990"
        Write-Host "4. Set a Sunshine Username/Pass, then go to the 'PIN' tab."
        Write-Host "5. Open Moonlight on your PC, connect to the ZeroTier IP, and pair."
        Write-Host "----------------------------------------------------------------"

        while ($true) { Start-Sleep -Seconds 60 }
